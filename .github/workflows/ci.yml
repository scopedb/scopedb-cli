name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, ready_for_review, converted_to_draft ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          # mise "latest" resolves to the v2026.9.3 tag, whose release assets were never published.
          version: 2026.9.2

      - name: Setup Go cache
        uses: ./.github/actions/setup-go-cache

      - run: mise run check

  test:
    name: Build and test
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          # mise "latest" resolves to the v2026.9.3 tag, whose release assets were never published.
          version: 2026.9.2

      - name: Setup Go cache
        uses: ./.github/actions/setup-go-cache

      - name: Build
        run: mise run build

      - name: Run all tests with the race detector
        run: mise run test:race

  required:
    name: Required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && github.event.pull_request.draft == false }}
    needs:
      - check
      - test
    steps:
      - name: Guardian
        run: |
          if [[ ! ( \
                 "${{ needs.check.result }}" == "success" && \
                 "${{ needs.test.result }}" == "success" \
              ) ]]; then
            echo "Required jobs haven't been completed successfully."
            exit -1
          fi
