name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, build, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          # mise "latest" resolves to the v2026.9.3 tag, whose release assets were never published.
          version: 2026.9.2

      - name: Setup Go cache
        uses: ./.github/actions/setup-go-cache

      - name: Check
        run: mise run check

      - name: Build
        run: mise run build

      - name: Run all tests with the race detector
        run: mise run test:race
